<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template UI Preview</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: -0.025em;
        }
        .template-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }
        .rendered-content {
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .field {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .field:last-child {
            border-bottom: none;
        }
        .field-name {
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 8px;
        }
        .field-value {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Template Preview</h1>

        <div class="template-card">
            <span class="label">Consultation Note v1</span>
            <div class="rendered-content">
                <div class="field"><span class="field-name">Patient:</span> <span class="field-value">John Doe</span></div>
                <div class="field"><span class="field-name">Notes:</span> <span class="field-value">Patient is responding well to treatment. Stable vitals.</span></div>
                <div class="field"><span class="field-name">Verified:</span> <span class="field-value">Blood Pressure, Heart Rate, SpO2</span></div>
            </div>
        </div>

        <div class="template-card">
            <span class="label">Patient Summary v1</span>
            <div class="rendered-content">
                <div class="field"><span class="field-name">Patient:</span> <span class="field-value">Jane Smith</span></div>
                <div class="field"><span class="field-name">Age:</span> <span class="field-value">28</span></div>
                <div class="field"><span class="field-name">Summary:</span> <span class="field-value">Overall healthy. Recommended more physical activity and vitamin D supplements.</span></div>
            </div>
        </div>
    </div>
</body>
</html>
