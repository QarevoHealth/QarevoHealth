name: Docker Build - Web

on:
  push:
    branches:
      - feature/MVP-010-docker-standardization-clean
    paths:
      - "apps/web/**"
      - ".github/workflows/docker-build-web.yml"

jobs:
  docker-build-web:
    name: Build, Scan and Notify Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --ignore-scripts

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Type check
        working-directory: apps/web
        run: pnpm tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Git SHA
        id: vars
        run: |
          echo "sha=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          tags: qarevo-web:${{ steps.vars.outputs.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on Web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qarevo-web:${{ steps.vars.outputs.sha }}
          format: json
          output: trivy-web.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Parse Trivy Results
        id: trivy
        run: |
          WEB_CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-web.json)
          WEB_HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-web.json)

          echo "web_critical=$WEB_CRITICAL" >> $GITHUB_OUTPUT
          echo "web_high=$WEB_HIGH" >> $GITHUB_OUTPUT

      - name: Generate HTML Report
        run: |
          cat > vulnerability-report.html << 'EOF'
          <html>
          <head>
            <title>Qarevo Web Security Scan Report</title>
            <style>
              body { font-family: Arial, sans-serif; margin:20px; }
              table { border-collapse: collapse; width:100%; }
              th, td {
                border:1px solid #ddd;
                padding:8px;
                text-align:left;
              }
              th { background:#f2f2f2; }
              .critical { background:#ffcccc; }
              .high { background:#fff0cc; }
            </style>
          </head>
          <body>
          <h1>Qarevo Web Security Scan Report</h1>
          <table>
          <tr>
            <th>Severity</th>
            <th>CVE</th>
            <th>Package</th>
            <th>Installed Version</th>
            <th>Fixed Version</th>
          </tr>
          EOF

          jq -r '
            .Results[].Vulnerabilities[]? |
            select(.Severity=="CRITICAL" or .Severity=="HIGH") |
            "<tr class=\"" +
            (if .Severity=="CRITICAL" then "critical" else "high" end) +
            "\"><td>" + .Severity +
            "</td><td>" + .VulnerabilityID +
            "</td><td>" + .PkgName +
            "</td><td>" + .InstalledVersion +
            "</td><td>" + (.FixedVersion // "N/A") +
            "</td></tr>"
          ' trivy-web.json >> vulnerability-report.html

          echo "</table></body></html>" >> vulnerability-report.html

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: web-security-reports
          path: |
            trivy-web.json
            vulnerability-report.html

      - name: Notify Teams
        if: always()
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.trivy.outputs.web_critical }}" -gt 0 ]; then
            COLOR="FF0000"
            STATUS="FAILED - Critical vulnerabilities detected"
          else
            COLOR="00AA00"
            STATUS="PASSED"
          fi

          curl -H "Content-Type: application/json" \
          -d '{
            "@type":"MessageCard",
            "@context":"https://schema.org/extensions",
            "themeColor":"'"$COLOR"'",
            "summary":"Qarevo Web Security Scan",
            "title":"Qarevo Web Security Scan Results",
            "sections":[{
              "facts":[
                {"name":"Repository","value":"${{ github.repository }}"},
                {"name":"Branch","value":"${{ github.ref_name }}"},
                {"name":"Image","value":"qarevo-web:${{ steps.vars.outputs.sha }}"},
                {"name":"Security Status","value":"'"$STATUS"'"},
                {"name":"Web Critical","value":"${{ steps.trivy.outputs.web_critical }}"},
                {"name":"Web High","value":"${{ steps.trivy.outputs.web_high }}"},
                {"name":"Security Report","value":"Download artifact: web-security-reports"}
              ]
            }],
            "potentialAction":[{
              "@type":"OpenUri",
              "name":"View Workflow Run",
              "targets":[{
                "os":"default",
                "uri":"'"$WORKFLOW_URL"'"
              }]
            }]
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Security Gate
        if: always()
        run: |
          if [ "${{ steps.trivy.outputs.web_critical }}" -gt 0 ]; then
            echo "Critical vulnerabilities found."
            exit 1
          fi
