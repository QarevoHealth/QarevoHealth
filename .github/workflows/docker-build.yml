name: Docker Build

on:
  push:
    branches:
      - feature/MVP-010-docker-standardization-clean

jobs:
  docker-build:
    name: Build, Scan and Notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Git SHA
        id: vars
        run: |
          echo "sha=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/video-conference
          tags: qarevo-api:${{ steps.vars.outputs.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          tags: qarevo-web:${{ steps.vars.outputs.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: qarevo-api:${{ steps.vars.outputs.sha }}
          format: json
          output: trivy-api.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Run Trivy scan on Web image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: qarevo-web:${{ steps.vars.outputs.sha }}
          format: json
          output: trivy-web.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Parse Trivy Results
        id: trivy
        run: |
          API_CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-api.json)
          API_HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-api.json)

          WEB_CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-web.json)
          WEB_HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-web.json)

          echo "api_critical=$API_CRITICAL" >> $GITHUB_OUTPUT
          echo "api_high=$API_HIGH" >> $GITHUB_OUTPUT
          echo "web_critical=$WEB_CRITICAL" >> $GITHUB_OUTPUT
          echo "web_high=$WEB_HIGH" >> $GITHUB_OUTPUT

      - name: Download Trivy HTML Template
        run: |
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o html.tpl

      - name: Merge Trivy Reports
        run: |
          jq -s '.' trivy-api.json trivy-web.json > trivy-report.json

      - name: Generate Consolidated HTML Report
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            aquasec/trivy:latest convert \
            --format template \
            --template "@/work/html.tpl" \
            --output /work/trivy-report.html \
            /work/trivy-report.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-api.json
            trivy-web.json
            trivy-report.json
            trivy-report.html

      - name: Notify Teams
        if: always()
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" \
          -d '{
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "FF0000",
            "summary": "Qarevo Security Scan",
            "title": "Qarevo Security Scan Results",
            "sections": [{
              "facts": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}"
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}"
                },
                {
                  "name": "API Critical",
                  "value": "${{ steps.trivy.outputs.api_critical }}"
                },
                {
                  "name": "API High",
                  "value": "${{ steps.trivy.outputs.api_high }}"
                },
                {
                  "name": "Web Critical",
                  "value": "${{ steps.trivy.outputs.web_critical }}"
                },
                {
                  "name": "Web High",
                  "value": "${{ steps.trivy.outputs.web_high }}"
                }
              ]
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View Workflow & Download Reports",
              "targets": [{
                "os": "default",
                "uri": "'"$WORKFLOW_URL"'"
              }]
            }]
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"