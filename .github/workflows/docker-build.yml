name: Docker Build

on:
  push:
    branches:
      - feature/MVP-010-docker-standardization-clean

jobs:
  docker-build:
    name: Build and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Git SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/video-conference
          tags: qarevo-api:${{ steps.vars.outputs.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          tags: qarevo-web:${{ steps.vars.outputs.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: qarevo-api:${{ steps.vars.outputs.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: false

      - name: Run Trivy vulnerability scanner on Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: qarevo-web:${{ steps.vars.outputs.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: false

      - name: Notify Teams
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="00FF00"
            STATUS="SUCCESS"
          else
            COLOR="FF0000"
            STATUS="FAILED"
          fi

          curl -H "Content-Type: application/json" \
          -d '{
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "'"$COLOR"'",
            "summary": "Qarevo Docker Build",
            "title": "Qarevo Docker Build - '"$STATUS"'",
            "sections": [{
              "facts": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}"
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}"
                },
                {
                  "name": "Commit",
                  "value": "${{ github.sha }}"
                },
                {
                  "name": "Workflow",
                  "value": "${{ github.workflow }}"
                },
                {
                  "name": "Run Number",
                  "value": "${{ github.run_number }}"
                },
                {
                  "name": "Status",
                  "value": "'"$STATUS"'"
                }
              ]
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View Workflow Run",
              "targets": [{
                "os": "default",
                "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }]
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"