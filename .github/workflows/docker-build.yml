name: Docker Build

on:
push:
branches:
- feature/MVP-010-docker-standardization-clean

jobs:
docker-build:
name: Build, Scan and Notify
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Determine Git SHA
    id: vars
    run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

  - name: Build API image
    uses: docker/build-push-action@v6
    with:
      context: ./services/video-conference
      tags: qarevo-api:${{ steps.vars.outputs.sha }}
      load: true
      cache-from: type=gha
      cache-to: type=gha,mode=max

  - name: Build Web image
    uses: docker/build-push-action@v6
    with:
      context: ./apps/web
      tags: qarevo-web:${{ steps.vars.outputs.sha }}
      load: true
      cache-from: type=gha
      cache-to: type=gha,mode=max

  - name: Run Trivy scan on API image
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: qarevo-api:${{ steps.vars.outputs.sha }}
      format: json
      output: trivy-api.json
      severity: CRITICAL,HIGH
      exit-code: 0
      ignore-unfixed: false

  - name: Run Trivy scan on Web image
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: qarevo-web:${{ steps.vars.outputs.sha }}
      format: json
      output: trivy-web.json
      severity: CRITICAL,HIGH
      exit-code: 0
      ignore-unfixed: false

  - name: Upload Trivy Reports
    uses: actions/upload-artifact@v4
    with:
      name: trivy-reports
      path: |
        trivy-api.json
        trivy-web.json

  - name: Notify Teams
    if: always()
    run: |
      curl -H "Content-Type: application/json" \
        -d '{
          "@type": "MessageCard",
          "@context": "https://schema.org/extensions",
          "themeColor": "0078D7",
          "summary": "Qarevo Docker Build",
          "title": "Qarevo Docker Build",
          "sections": [{
            "facts": [
              {
                "name": "Repository",
                "value": "${{ github.repository }}"
              },
              {
                "name": "Branch",
                "value": "${{ github.ref_name }}"
              },
              {
                "name": "Commit",
                "value": "${{ github.sha }}"
              },
              {
                "name": "Workflow",
                "value": "${{ github.workflow }}"
              },
              {
                "name": "Status",
                "value": "${{ job.status }}"
              }
            ]
          }],
          "potentialAction": [{
            "@type": "OpenUri",
            "name": "View Workflow Run",
            "targets": [{
              "os": "default",
              "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }]
        }' \
        "${{ secrets.TEAMS_WEBHOOK_URL }}"
```
